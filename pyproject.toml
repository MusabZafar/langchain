[project]
name = "langchain-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MusabZafar", email = "musabzafar03@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.1",
    "langchain-groq>=1.2.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.8.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.24",
    "langgraph-cli[inmem]>=0.1.55",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain = "langchain:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
